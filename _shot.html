<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #f6f1e7; }
    iframe { width: 1440px; height: 1000px; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="frame" src="/index.html"></iframe>
  <script>
    const y = Number(new URLSearchParams(location.search).get("y") || 0);
    const frame = document.getElementById("frame");
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      doc.documentElement.style.scrollBehavior = "auto";
      frame.contentWindow.scrollTo(0, y);
    });
  </script>
</body>
</html>
